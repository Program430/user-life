name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run tests when present
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            poetry run pytest
          else
            echo "No tests found; skipping pytest."
          fi

      - name: Run Ruff
        run: poetry run ruff check src alembic
