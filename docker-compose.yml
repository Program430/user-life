services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: userlife
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - userlife-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userlife"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_NAME: userlife
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/userlife
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  userlife-postgres-data:
